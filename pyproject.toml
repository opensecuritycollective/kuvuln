[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kuvuln"
version = "3.0.0"
description = "KuVuln: Kubernetes-native security analysis for manifests, Helm, Kustomize, Go modules and container images."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "KuVuln contributors" }]
keywords = ["kubernetes", "security", "sca", "sast", "devsecops", "go", "supply-chain"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = ["ruamel.yaml>=0.18.6,<0.21"]

[project.scripts]
kuvuln = "kuvuln.cli:main"

[project.urls]
Homepage = "https://github.com/bleon-ethical/kuvuln"
Issues = "https://github.com/bleon-ethical/kuvuln/issues"
Security = "https://github.com/bleon-ethical/kuvuln/security"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
